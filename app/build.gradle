plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystorePath = System.getenv('FLOWSER_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('FLOWSER_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('FLOWSER_KEY_ALIAS')
def releaseKeyPassword = System.getenv('FLOWSER_KEY_PASSWORD')
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
        'Release signing is not configured. Set FLOWSER_KEYSTORE_PATH, ' +
        'FLOWSER_KEYSTORE_PASSWORD, FLOWSER_KEY_ALIAS and FLOWSER_KEY_PASSWORD.'
    )
}

android {
    namespace 'com.flowser.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flowser.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
